<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۴۰۴ | صفحه پیدا نشد — 24FM</title>
  <meta name="description" content="متأسفانه صفحه‌ای که دنبال می‌گردید پیدا نشد. لطفاً به صفحه اصلی برگردید.">
  <meta name="robots" content="noindex, follow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #2a1200 0%, #1a0a00 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
    }
    
    .error-code {
      font-size: 120px;
      font-weight: 700;
      color: #c87020;
      text-shadow: 0 4px 20px rgba(200, 112, 32, 0.3);
      margin-bottom: 20px;
      line-height: 1;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #fff;
    }
    
    p {
      font-size: 16px;
      color: #bbb;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #c87020, #a85018);
      color: #fff;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(200, 112, 32, 0.3);
    }
    
    .btn-secondary {
      background: transparent;
      color: #c87020;
      border: 2px solid #c87020;
    }
    
    .btn-secondary:hover {
      background: rgba(200, 112, 32, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">۴۰۴</div>
    <h1>صفحه پیدا نشد</h1>
    <p>متأسفانه صفحه‌ای که دنبال می‌گردید وجود ندارد یا حذف شده است.</p>
    
    <div class="actions">
      <a href="/" class="btn btn-primary">بازگشت به صفحه اصلی</a>
      <a href="javascript:history.back()" class="btn btn-secondary">بازگشت</a>
    </div>
  </div>
</body>
</html>

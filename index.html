  <meta name="keywords" content="آهنگ ۲۴ ساعته، آهنگ شبانه‌روزی، رادیو شبانه‌روزی، رادیو ۲۴ ساعته، ۲۴ اف‌ام، اف‌ام ۲۴، فرکانس ۲۴، موج ۲۴، گرامافون ۲۴، رادیو آنلاین، موسیقی آنلاین، پخش زنده موسیقی، 24fm، 24 fm، radio online persian، rádio 24h، موسیقی رایگان، پخش آهنگ، استریم موسیقی، رادیو ایرانی، radio irani">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/">

  <!-- Open Graph -->
  <meta property="og:title" content="اف‌ام ۲۴ | 24FM">
  <meta property="og:description" content="موسیقی بی‌وقفه، به سبک خودت — رادیو آنلاین ۲۴ ساعته">
  <meta property="og:image" content="https://yourdomain.com/banner.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://yourdomain.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="24FM">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="اف‌ام ۲۴ | 24FM">
  <meta name="twitter:description" content="موسیقی بی‌وقفه، به سبک خودت">
  <meta name="twitter:image" content="https://yourdomain.com/banner.jpg">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="state-off">

  <!-- Noise overlay for texture -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Main wrapper -->
  <main class="site-wrapper">

    <!-- Hero / Brand -->
    <header class="hero">
      <div class="brand-name">24FM</div>
      <p class="brand-tagline">موسیقی بی‌وقفه، به سبک خودت</p>
    </header>

    <!-- Gramophone Player -->
    <section class="gramophone-section" id="gramophone-section">

      <!-- CD Track info display -->
      <div class="track-info" id="track-info">
        <span class="track-genre" id="track-genre-label">سبک انتخابی</span>
        <span class="track-dot">●</span>
        <span class="track-live">زنده</span>
      </div>

      <!-- Gramophone unit -->
      <div class="gramophone" id="gramophone">

        <!-- Vinyl / CD -->
        <div class="cd-wrap" id="cd-wrap">
          <div class="record" id="record">
            <div class="record-grooves"></div>
            <div class="label">
              <span class="label-text">24FM</span>
            </div>
          </div>
        </div>

        <!-- Tone arm (starts resting = parked to the right) -->
        <div class="tone-arm resting" id="tone-arm">
          <div class="arm-pivot"></div>
          <div class="arm-shaft">
            <div class="arm-cartridge"></div>
          </div>
        </div>

        <!-- Buffering spinner -->
        <div class="buffer-ring" id="buffer-ring" aria-hidden="true"></div>

        <!-- Controls bar -->
        <div class="controls-bar">

          <!-- Genre button -->
          <button class="btn-genre" id="btn-genre" aria-label="انتخاب سبک موسیقی">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>سبک</span>
          </button>

          <!-- Play/Pause button -->
          <button class="btn-play" id="btn-play" aria-label="پخش / توقف">
            <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
            <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>

          <!-- Volume -->
          <div class="volume-wrap">
            <svg class="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
              <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
              <path d="M19.07,4.93a10,10,0,0,1,0,14.14"/>
            </svg>
            <input type="range" class="volume-slider" id="volume-slider"
                   min="0" max="1" step="0.05" value="1"
                   aria-label="میزان صدا">
          </div>

        </div>

      </div><!-- /gramophone -->

      <!-- Error message — BELOW gramophone, not inside it -->
      <div class="stream-error" id="stream-error" aria-live="polite">
        خطا در اتصال به استریم | لطفاً دوباره تلاش کنید
      </div>

    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <p class="footer-quote">ساعتش مهم نیست، اینجا موزیک همیشه هست</p>
      <p class="footer-credit">
        <a href="https://t.me/BrooklynWasHere" style="color: white; text-decoration: none; font-weight: bold; position: relative;">
          خلق شده با <span class="heart">🧡</span> توسط تیم <span class="brooklyn">بروکسِل</span>
        </a>
      </p>
    </footer>

  </main>

  <!-- Genre Popup -->
  <div class="popup-overlay" id="popup-overlay" aria-hidden="true">
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-label="انتخاب سبک موسیقی">
      <div class="popup-header">
        <h2 class="popup-title">سبک موسیقی را انتخاب کنید</h2>
        <button class="popup-close" id="popup-close" aria-label="بستن">✕</button>
      </div>
      <div class="genre-grid" id="genre-grid">
        <!-- Genres injected by popup.js -->
      </div>
      <div class="popup-poweroff">
        <button class="btn-poweroff" id="btn-poweroff" aria-label="خاموش کردن">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
          Power Off
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/hls.min.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/player.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
